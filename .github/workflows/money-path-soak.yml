name: Money-path soak

on:
  pull_request:
    paths:
      - ".github/workflows/money-path-soak.yml"
      - "apps/api/src/duels/**"
      - "apps/api/src/matchmaking/**"
      - "apps/api/src/providers/**"
      - "apps/api/src/transactions/**"
      - "apps/api/src/treasury/**"
      - "scripts/money-path-soak.ts"
      - "scripts/money-path-soak/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: Complete deterministic suite iterations
        required: true
        default: "24"
        type: string
      concurrency:
        description: Parallel suite workers
        required: true
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: money-path-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAILYDRAFT_NETWORK: solana-devnet
      SOAK_FIXTURE_MODE: deterministic
      SOAK_ITERATIONS: ${{ inputs.iterations || (github.event_name == 'pull_request' && '6' || '24') }}
      SOAK_CONCURRENCY: ${{ inputs.concurrency || '3' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Generate the workflow-local database client
        run: bun --filter @dailydraft/db db:generate
      - name: Exercise deterministic money-path invariants
        run: >-
          bun scripts/money-path-soak.ts
          --iterations "$SOAK_ITERATIONS"
          --concurrency "$SOAK_CONCURRENCY"
          --report artifacts/money-path-soak.json
      - name: Retain bounded soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: money-path-soak-${{ github.run_attempt }}
          path: artifacts/money-path-soak.json
          if-no-files-found: error
          retention-days: 7
