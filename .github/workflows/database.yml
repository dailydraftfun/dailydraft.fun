name: Database migrations

on:
  pull_request:
    paths:
      - apps/api/**
      - packages/db/**
      - .github/workflows/database.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/db/**
      - .github/workflows/database.yml

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dailydraft_ci
          POSTGRES_PASSWORD: dailydraft
          POSTGRES_USER: dailydraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dailydraft -d dailydraft_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dailydraft:dailydraft@localhost:5432/dailydraft_ci?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Apply committed migrations
        run: bun --filter @dailydraft/db db:deploy
      - name: Verify house treasury migration contract
        run: |
          database_url="${DATABASE_URL%%\?*}"
          psql "$database_url" \
            --set ON_ERROR_STOP=1 \
            --file packages/db/prisma/verify-house-treasury.sql
      - name: Verify Flip inventory migration contract
        run: |
          database_url="${DATABASE_URL%%\?*}"
          psql "$database_url" \
            --set ON_ERROR_STOP=1 \
            --file packages/db/prisma/verify-flip-inventory.sql
      - name: Verify Flip rules and session-pool migration contract
        run: |
          database_url="${DATABASE_URL%%\?*}"
          psql "$database_url" \
            --set ON_ERROR_STOP=1 \
            --file packages/db/prisma/verify-flip-rules.sql
      - name: Generate Prisma client
        run: bun --filter @dailydraft/db db:generate
      - name: Exercise raw SQL against the real driver
        working-directory: apps/api
        env:
          REQUIRE_DB_INTEGRATION: '1'
        run: >-
          bun test
          src/database/advisory-lock.database.test.ts
          src/crash/crash-risk.database.test.ts
          src/crash/crash-stage-state.database.test.ts
          src/crash/crash-settlement.database.test.ts
          src/flip/flip-rules.database.test.ts
          src/gacha/gacha-payment-idempotency.database.test.ts
      - name: Validate Prisma schema
        run: bun --filter @dailydraft/db db:validate
      - name: Prove schema-only drift is rejected
        working-directory: packages/db
        run: |
          drift_schema="$RUNNER_TEMP/schema-drift.prisma"
          cp prisma/schema.prisma "$drift_schema"
          printf '\nmodel MigrationDriftSentinel {\n  id Int @id\n}\n' >> "$drift_schema"

          set +e
          bunx --bun prisma migrate diff \
            --from-config-datasource \
            --to-schema "$drift_schema" \
            --exit-code
          drift_status=$?
          set -e

          test "$drift_status" -eq 2
      - name: Reject migration and schema drift
        run: bun --filter @dailydraft/db db:drift-check
