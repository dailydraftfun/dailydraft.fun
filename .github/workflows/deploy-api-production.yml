name: Deploy API production

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - "apps/api/Dockerfile"
      - ".github/workflows/deploy-api-production.yml"
  workflow_dispatch:

jobs:
  deploy:
    environment: Production
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_BUCKET: openpacksduel-production-deploy-948918267147-us-west-1
      AWS_REGION: us-west-1
      INSTANCE_ID: i-00e74422e719396c3
      IMAGE_NAME: openpacksduel
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948918267147:role/openpacksduel-github-production-deploy
          aws-region: us-west-1

      - name: Build production image
        run: docker build --file apps/api/Dockerfile --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Upload immutable image artifact
        run: |
          set -euo pipefail
          artifact_file="${RUNNER_TEMP}/openpacksduel-${GITHUB_SHA}.tar.gz"
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip >"$artifact_file"
          aws s3 cp \
            "$artifact_file" \
            "s3://${ARTIFACT_BUCKET}/images/openpacksduel-${GITHUB_SHA}.tar.gz" \
            --only-show-errors

      - name: Deploy through Systems Manager
        run: |
          set -euo pipefail
          image_key="images/openpacksduel-${GITHUB_SHA}.tar.gz"
          host_command="/usr/local/bin/deploy-openpacksduel '${image_key}' '${GITHUB_SHA}'"
          parameters="$(jq -cn --arg command "$host_command" '{commands: [$command]}')"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$parameters" \
              --comment "Deploy OpenPacksDuel API ${GITHUB_SHA}" \
              --query "Command.CommandId" \
              --output text
          )"

          invocation=""
          status="Pending"
          for _ in $(seq 1 120); do
            if invocation="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --output json \
                2>/dev/null
            )"; then
              status="$(jq -r '.Status' <<<"$invocation")"
              case "$status" in
                Success|Failed|TimedOut|Cancelled|Cancelling)
                  break
                  ;;
              esac
            fi
            sleep 5
          done

          if [[ -n "$invocation" ]]; then
            jq -r '"Host status: \(.Status)\n\nHost stdout:\n\(.StandardOutputContent)\n\nHost stderr:\n\(.StandardErrorContent)"' \
              <<<"$invocation"
          else
            echo "No SSM command invocation was returned for ${command_id}" >&2
          fi

          if [[ "$status" != "Success" ]]; then
            echo "Deployment failed with SSM status ${status}" >&2
            exit 1
          fi
