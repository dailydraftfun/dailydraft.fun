name: Deploy API production

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - "apps/api/Dockerfile"
      - "deploy/dailydraft/**"
      - ".github/workflows/deploy-api-production.yml"
  workflow_dispatch:

# Two overlapping runs would race on docker load, prisma migrate deploy, and the
# rm/rename swap, which can leave the host with no container named dailydraft.
# Never cancel in flight: a half-applied deploy is worse than a queued one.
concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: Production
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_BUCKET: dailydraft-production-deploy-948918267147-us-west-1
      AWS_REGION: us-west-1
      INSTANCE_ID: i-00e74422e719396c3
      IMAGE_NAME: dailydraft
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948918267147:role/dailydraft-github-production-deploy
          aws-region: us-west-1

      - name: Build production image
        run: docker build --file apps/api/Dockerfile --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Upload immutable image artifact
        run: |
          set -euo pipefail
          artifact_file="${RUNNER_TEMP}/dailydraft-${GITHUB_SHA}.tar.gz"
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip >"$artifact_file"
          aws s3 cp \
            "$artifact_file" \
            "s3://${ARTIFACT_BUCKET}/images/dailydraft-${GITHUB_SHA}.tar.gz" \
            --only-show-errors

      # /usr/local/bin/deploy-dailydraft used to be installed by hand, so edits to
      # the tracked script changed nothing on the host and the two drifted apart
      # silently. Shipping it alongside the image pins both to the same commit.
      - name: Upload host deploy script
        run: |
          set -euo pipefail
          aws s3 cp \
            deploy/dailydraft/deploy-dailydraft.sh \
            "s3://${ARTIFACT_BUCKET}/scripts/deploy-dailydraft-${GITHUB_SHA}.sh" \
            --only-show-errors

      - name: Deploy through Systems Manager
        run: |
          set -euo pipefail
          image_key="images/dailydraft-${GITHUB_SHA}.tar.gz"
          script_key="scripts/deploy-dailydraft-${GITHUB_SHA}.sh"
          # AWS-RunShellScript concatenates these into one bash script, so the
          # leading set and the temporary file carry across the whole sequence.
          parameters="$(
            jq -cn \
              --arg bucket "$ARTIFACT_BUCKET" \
              --arg region "$AWS_REGION" \
              --arg script_key "$script_key" \
              --arg image_key "$image_key" \
              --arg sha "$GITHUB_SHA" \
              '{commands: [
                 "set -euo pipefail",
                 "script_file=\"$(mktemp)\"",
                 "aws s3 cp \"s3://\($bucket)/\($script_key)\" \"$script_file\" --region \($region) --only-show-errors",
                 "install -m 755 \"$script_file\" /usr/local/bin/deploy-dailydraft",
                 "rm -f \"$script_file\"",
                 "/usr/local/bin/deploy-dailydraft \($image_key|@sh) \($sha|@sh)"
               ]}'
          )"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$parameters" \
              --comment "Deploy DailyDraft API ${GITHUB_SHA}" \
              --query "Command.CommandId" \
              --output text
          )"

          invocation=""
          status="Pending"
          for _ in $(seq 1 120); do
            if invocation="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --output json \
                2>/dev/null
            )"; then
              status="$(jq -r '.Status' <<<"$invocation")"
              case "$status" in
                Success|Failed|TimedOut|Cancelled|Cancelling)
                  break
                  ;;
              esac
            fi
            sleep 5
          done

          if [[ -n "$invocation" ]]; then
            jq -r '"Host status: \(.Status)\n\nHost stdout:\n\(.StandardOutputContent)\n\nHost stderr:\n\(.StandardErrorContent)"' \
              <<<"$invocation"
          else
            echo "No SSM command invocation was returned for ${command_id}" >&2
          fi

          if [[ "$status" != "Success" ]]; then
            echo "Deployment failed with SSM status ${status}" >&2
            exit 1
          fi
