          maxLength: 240
          pattern: '^crashref_[a-f0-9]{32}$'
        scheduledDeadline:
          type: [string, 'null']
          format: date-time
        stage:
          type: integer
          minimum: 1
        terminalReason:
          type: [string, 'null']
          maxLength: 480
