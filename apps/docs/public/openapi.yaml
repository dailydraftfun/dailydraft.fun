                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/reconciliation/treasury:
    get:
      operationId: reconcileHouseTreasuryFromCron
      tags: [Operations]
      summary: Reconcile finalized devnet liquidity, inventory custody, and reservation lifecycle
      x-dailydraft-availability: internal-devnet
      security:
        - cronSecret: []
        - integrationKey: []
      responses:
        '200':
          description: Bounded treasury reconciliation summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: reconcileHouseTreasuryManually
      tags: [Operations]
      summary: Manually reconcile finalized treasury, custody, and reservation state
      description: Accepts the cron secret or an integration API key.
      x-dailydraft-availability: internal-devnet
      security:
        - cronSecret: []
        - integrationKey: []
      responses:
        '200':
          description: Bounded treasury reconciliation summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /admin/treasury/inventory/{inventoryId}/disposition:
    put:
      operationId: setHouseInventoryDisposition
      tags: [Operations]
      summary: Select an allowed hold, buyback, list, promotion, or review workflow
      description: Records operator intent only; it does not call an undocumented marketplace API.
      x-dailydraft-availability: devnet-gated
      security:
        - integrationKey: []
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: string
            pattern: '^hinv_[a-f0-9]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disposition, reason]
              properties:
                disposition:
                  type: string
                  enum: [hold, buyback, list, promotion, manual_review]
                reason:
                  type: string
                  minLength: 3
                  maxLength: 160
      responses:
        '200':
          description: Durable disposition intent and immutable ledger evidence recorded
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/treasury/inventory/{inventoryId}/disposition/complete:
    post:
      operationId: completeHouseInventoryDisposition
      tags: [Operations]
      summary: Record verified realized USDC proceeds for a completed disposition
      x-dailydraft-availability: devnet-gated
      security:
        - integrationKey: []
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema:
            type: string
            pattern: '^hinv_[a-f0-9]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [realizedAmount, realizedCurrency, realizedDecimals, reason]
              properties:
                realizedAmount: { type: string, pattern: '^\d+$' }
                realizedCurrency: { type: string, const: USDC }
                realizedDecimals: { type: integer, const: 6 }
                reason: { type: string, minLength: 3, maxLength: 160 }
      responses:
        '200':
          description: Inventory marked disposed and realized proceeds appended to the ledger
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/emergency-pause:
    get:
      operationId: getEmergencyPause
      tags: [Operations]
      summary: Read the global new-exposure pause state
      x-dailydraft-availability: devnet
      security:
        - integrationKey: []
      responses:
        '200':
          description: Current emergency control state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyPauseState'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: setEmergencyPause
      tags: [Operations]
      summary: Idempotently pause or resume new exposure with an immutable audit record
      description: |
        Identical state-and-reason retries are no-ops. The audit actor is the
        fixed integration-key class; the raw bearer key is never persisted.
      x-dailydraft-availability: devnet
      security:
        - integrationKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyPauseRequest'
      responses:
        '200':
          description: Updated or already-current emergency state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyPauseState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/audit:
    get:
      operationId: listOperatorAudit
      tags: [Operations]
      summary: Paginate immutable emergency-control audit events
      x-dailydraft-availability: devnet
      security:
        - integrationKey: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          schema:
            type: string
            pattern: '^oaud_[a-f0-9]{32}$'
      responses:
        '200':
          description: Append-only audit history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/provider/duels/{duelId}/escrow/transactions:
    post:
      operationId: prepareProviderEscrowTransaction
      tags: [Transactions]
      summary: Prepare an unsigned provider/result/settlement escrow transaction
      description: |
        Integration-only, devnet-only boundary. The API never signs or submits.
        Real card operations fail closed for mock/incomplete provider outcomes,
        unsupported asset standards, noncanonical comparison values or policies,
        invalid legacy SPL mint metadata, and missing vault custody.
      x-dailydraft-availability: devnet-gated
      security:
        - integrationKey: []
      parameters:
        - $ref: '#/components/parameters/DuelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareProviderEscrowRequest'
      responses:
        '201':
          description: Unsigned transaction and public proof binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedProviderEscrowTransaction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    cronSecret:
      type: http
      scheme: bearer
      bearerFormat: random server secret
      description: Host reconciliation timer bearer secret; accepted only by internal worker routes.
    integrationKey:
      type: http
      scheme: bearer
      bearerFormat: opd_live_...
      description: Server-side integration key. Never expose it in browser code.
    walletSession:
      type: http
      scheme: bearer
      bearerFormat: opd_devnet_session_...
      description: Opaque 15-minute session issued after a Solana devnet Ed25519 signature.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PackId:
      name: packId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PackId'
    GachaMachineKey:
      name: machineKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GachaMachineKey'
    DuelId:
      name: duelId
      in: path
      required: true
      schema:
        type: string
        pattern: '^duel_[A-Za-z0-9]{12,64}$'
    Wallet:
      name: wallet
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SolanaAddress'
    ValuationPolicyHash:
      name: policyHash
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^tx_[A-Za-z0-9]{12,64}$'
    ReconciliationLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid, or expired bearer credential
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated caller is not allowed to access this resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Request conflicts with current duel state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Required server configuration or dependency is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AdminPage:
      type: object
      additionalProperties: false
      required: [data, hasMore, nextCursor]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        hasMore:
          type: boolean
        nextCursor:
          type: [string, 'null']
    OperatorReasonCode:
      type: string
      enum:
        - maintenance
        - provider_degraded
        - rpc_degraded
        - treasury_limit
        - security_incident
        - manual_review
    EmergencyPauseRequest:
      type: object
      additionalProperties: false
      required: [paused, reasonCode]
      properties:
        paused:
          type: boolean
        reasonCode:
          $ref: '#/components/schemas/OperatorReasonCode'
    EmergencyPauseState:
      type: object
      additionalProperties: false
      required: [paused, reasonCode, updatedAt, version]
      properties:
        paused:
          type: boolean
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/OperatorReasonCode'
            - type: 'null'
        updatedAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 0
    ClientProductEventName:
      type: string
      enum:
        - lobby_viewed
        - tier_selected
        - wallet_connected
        - wallet_authenticated
        - pack_reveal_started
        - duel_shared
        - duel_rematched
        - ui_error
    ProductEventInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/ClientProductEventName'
        duelId:
          type: string
          pattern: '^duel_[A-Za-z0-9]{12,64}$'
        status:
          $ref: '#/components/schemas/DuelStatus'
        tier:
          type: integer
          enum: [25, 50, 100]
        mode:
          $ref: '#/components/schemas/MatchmakingMode'
    IngestProductEventsRequest:
      type: object
      additionalProperties: false
      required: [sessionId, events]
      properties:
        sessionId:
          type: string
          pattern: '^anon_[a-f0-9]{32}$'
          description: Random per-tab correlation ID. It is not derived from a wallet.
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ProductEventInput'
    AnalyticsFunnelReport:
      type: object
      additionalProperties: false
      required: [generatedAt, window, sampled, funnel, rates, latencyMs, errors, experience, alerts, statusCounts]
      properties:
        generatedAt:
          type: string
          format: date-time
        window:
          type: object
          additionalProperties: true
        sampled:
          type: boolean
          description: True when the bounded 10,000-event reporting window was truncated.
        funnel:
          type: object
          additionalProperties: true
        rates:
          type: object
          additionalProperties:
            type: number
        latencyMs:
          type: object
          additionalProperties: true
        errors:
          type: object
          additionalProperties:
            type: integer
          description: Server-authored provider, settlement, and Solana RPC failures only.
        experience:
          type: object
          additionalProperties:
            type: integer
          description: Client UI errors and reveal-animation starts; never operational alerts.
        alerts:
          type: object
          additionalProperties: true
        statusCounts:
          type: object
          additionalProperties:
            type: integer
    CreateWalletChallengeRequest:
      type: object
      additionalProperties: false
      required: [wallet]
      properties:
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
    WalletChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, wallet, domain, uri, chain, message, expiresAt]
      properties:
        challengeId:
          type: string
          pattern: '^authc_[a-f0-9]{32}$'
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
        domain:
          type: string
        uri:
          type: string
          format: uri
        chain:
          type: string
          const: solana:devnet
        message:
          type: string
          description: Exact UTF-8 message the wallet must display and sign.
        expiresAt:
          type: string
          format: date-time
    CreateWalletSessionRequest:
      type: object
      additionalProperties: false
      required: [challengeId, wallet, signature]
      properties:
        challengeId:
          type: string
          pattern: '^authc_[a-f0-9]{32}$'
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
        signature:
          type: string
          contentEncoding: base64
    WalletSession:
      type: object
      additionalProperties: false
      required: [token, wallet, network, expiresAt]
      properties:
        token:
          type: string
          description: Opaque bearer token returned once; only its hash is stored server-side.
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
        network:
          type: string
          const: solana-devnet
        expiresAt:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required: [service, status, version, dependencies]
      properties:
        service:
          type: string
          const: dailydraft-api
        status:
          type: string
          const: ok
        version:
          type: string
          const: 0.2.0-devnet
        dependencies:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              const: ok
    CapabilityAvailability:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
        reason:
          type: [string, 'null']
    PackCapability:
      type: object
      additionalProperties: false
      required: [enabled, id, name, reason, tier]
      properties:
        enabled:
          type: boolean
        id:
          $ref: '#/components/schemas/PackId'
        name:
          type: string
        reason:
          type: [string, 'null']
        tier:
          type: integer
          enum: [25, 50, 100]
    ProductCapabilities:
      type: object
      additionalProperties: false
      required: [modes, network, packs, provider]
      properties:
        modes:
          type: object
          additionalProperties: false
          required: [direct, house, open]
          properties:
            direct:
              $ref: '#/components/schemas/CapabilityAvailability'
            house:
              $ref: '#/components/schemas/CapabilityAvailability'
            open:
              $ref: '#/components/schemas/CapabilityAvailability'
        network:
          type: string
          const: solana-devnet
        packs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PackCapability'
        provider:
          type: object
          additionalProperties: false
          required: [mode, ready]
          properties:
            mode:
              type: string
            ready:
              type: boolean
    GachaMachineKey:
      type: string
      pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
    GachaCapabilityGates:
      type: object
      additionalProperties: false
      required: [acquisition, odds, provider, settlement]
      properties:
        acquisition:
          type: boolean
        odds:
          type: boolean
        provider:
          type: boolean
        settlement:
          type: boolean
    GachaCapability:
      type: object
      additionalProperties: false
      required: [availability, gates, providerMode, reason]
      properties:
        availability:
          type: string
          enum: [playable, preview]
        gates:
          $ref: '#/components/schemas/GachaCapabilityGates'
        providerMode:
          type: string
          enum: [collector-crypt, fixture]
        reason:
          type: string
    GachaMachine:
      type: object
      additionalProperties: false
      required:
        - id
        - machineKey
        - sport
        - tierPriceMinor
        - tierPriceCurrency
        - tierPriceDecimals
        - displayName
        - committedPoolSize
        - active
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        machineKey:
          $ref: '#/components/schemas/GachaMachineKey'
        sport:
          type: string
          enum: [FOOTBALL, SOCCER, BASEBALL, BASKETBALL]
        tierPriceMinor:
          type: string
          pattern: '^[0-9]+$'
        tierPriceCurrency:
          type: string
          const: USDC
        tierPriceDecimals:
          type: integer
          const: 6
        displayName:
          type: string
        committedPoolSize:
          type: integer
          minimum: 0
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GachaInventorySnapshotEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - snapshotId
        - ordinal
        - eligible
        - exclusionReasons
        - providerCardReference
        - assetReference
        - displayName
        - sport
        - graded
        - graderReference
        - vaulted
        - poolOpen
        - tierEnabled
        - insuredValueMinor
        - insuredValueCurrency
        - insuredValueDecimals
        - insuredValueProviderReference
        - valuationSourceReference
        - valuationTimestamp
        - inventorySourceTimestamp
      properties:
        id:
          type: string
        snapshotId:
          type: string
        ordinal:
          type: integer
          minimum: 0
        eligible:
          type: boolean
        exclusionReasons:
          type: array
          items:
            type: string
            enum:
              - MISSING_INSURED_VALUE
              - MISSING_ASSET_REFERENCE
              - MISSING_VALUATION_SOURCE
              - STALE_VALUATION
              - FUTURE_VALUATION
              - POOL_CLOSED
              - TIER_DISABLED
              - NOT_VAULTED
              - UNGRADED
              - SPORT_MISMATCH
              - DUPLICATE_ASSET
              - MAXIMUM_ITEM_COUNT
        providerCardReference:
          type: string
        assetReference:
          type: [string, 'null']
        displayName:
          type: string
        sport:
          type: string
          enum: [FOOTBALL, SOCCER, BASEBALL, BASKETBALL]
        graded:
          type: boolean
        graderReference:
          type: [string, 'null']
        vaulted:
          type: boolean
        poolOpen:
          type: boolean
        tierEnabled:
          type: boolean
        insuredValueMinor:
          type: [string, 'null']
          pattern: '^[0-9]+$'
        insuredValueCurrency:
          type: [string, 'null']
        insuredValueDecimals:
          type: [integer, 'null']
        insuredValueProviderReference:
          type: [string, 'null']
        valuationSourceReference:
          type: [string, 'null']
        valuationTimestamp:
          type: [string, 'null']
          format: date-time
        inventorySourceTimestamp:
          type: string
          format: date-time
    GachaInventorySnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - poolKey
        - machineKey
        - revision
        - schemaVersion
        - policyVersion
        - provider
        - policyHash
        - contentHash
        - policy
        - committedPoolSize
        - maximumEligibleItems
        - maximumSourceAgeMs
        - maximumFutureSkewMs
        - eligibleCount
        - excludedCount
        - eligibleValueMinor
        - evaluatedAt
        - sealedAt
        - createdAt
        - machine
        - entries
      properties:
        id:
          type: string
        poolKey:
          type: string
        machineKey:
          $ref: '#/components/schemas/GachaMachineKey'
        revision:
          type: integer
          minimum: 1
        schemaVersion:
          type: string
        policyVersion:
          type: string
        provider:
          type: string
        policyHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        contentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        policy:
          type: object
          additionalProperties: true
        committedPoolSize:
          type: integer
          minimum: 0
        maximumEligibleItems:
          type: integer
          minimum: 1
        maximumSourceAgeMs:
          type: integer
          minimum: 0
        maximumFutureSkewMs:
          type: integer
          minimum: 0
        eligibleCount:
          type: integer
          minimum: 0
        excludedCount:
          type: integer
          minimum: 0
        eligibleValueMinor:
          type: string
          pattern: '^[0-9]+$'
        evaluatedAt:
          type: string
          format: date-time
        sealedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        machine:
          $ref: '#/components/schemas/GachaMachine'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/GachaInventorySnapshotEntry'
    GachaPullOddsCommitment:
      type: object
      additionalProperties: false
      required:
        - id
        - machineKey
        - oddsKey
        - version
        - schemaVersion
        - calculatorVersion
        - rulesHash
        - snapshotContentHash
        - probabilityScalePpm
        - baseProbabilityPpm
        - plusProbabilityPpm
        - premiumProbabilityPpm
        - chaseProbabilityPpm
        - bandMinimums
        - committedAt
        - sealedAt
        - createdAt
      properties:
        id:
          type: string
        machineKey:
          $ref: '#/components/schemas/GachaMachineKey'
        oddsKey:
          type: string
        version:
          type: integer
          minimum: 1
        schemaVersion:
          type: string
        calculatorVersion:
          type: string
        rulesHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        snapshotContentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        probabilityScalePpm:
          type: integer
          const: 1000000
        baseProbabilityPpm:
          type: integer
          minimum: 0
          maximum: 1000000
        plusProbabilityPpm:
          type: integer
          minimum: 0
          maximum: 1000000
        premiumProbabilityPpm:
          type: integer
          minimum: 0
          maximum: 1000000
        chaseProbabilityPpm:
          type: integer
          minimum: 0
          maximum: 1000000
        bandMinimums:
          type: object
          additionalProperties:
            type: string
            pattern: '^[0-9]+$'
        committedAt:
          type: string
          format: date-time
        sealedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    GachaRipSeedCommitment:
      type: object
      additionalProperties: false
      required: [commitmentId, serverSeedHash, expiresAt]
      properties:
        commitmentId:
          type: string
          minLength: 1
          maxLength: 240
        serverSeedHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expiresAt:
          type: string
          format: date-time
    CreateFixtureGachaRipRequest:
      type: object
      additionalProperties: false
      required: [machineKey, recipientWallet, seed, commitmentId]
      properties:
        machineKey:
          $ref: '#/components/schemas/GachaMachineKey'
        recipientWallet:
          type: string
          minLength: 1
          maxLength: 240
        seed:
          type: string
          minLength: 16
          maxLength: 240
        commitmentId:
          type: string
          minLength: 1
          maxLength: 240
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 240
        oddsVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
    GachaRip:
      type: object
      additionalProperties: false
      required:
        - id
        - machineKey
        - oddsCommitmentId
        - status
        - snapshotContentHash
        - oddsRulesHash
        - seedCommitmentHash
        - selectedAssetReference
        - failedAssetReference
        - acquisitionReference
        - settlementReference
        - insuredValueMinor
        - insuredValueCurrency
        - insuredValueDecimals
        - idempotencyKey
        - selectedAt
        - revealedAt
        - acquiredAt
        - settledAt
        - failedAt
        - failureReason
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        machineKey:
          $ref: '#/components/schemas/GachaMachineKey'
        oddsCommitmentId:
          type: string
        status:
          type: string
          enum: [SELECTED, REVEALED, ACQUIRED, SETTLED, FAILED]
        snapshotContentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        oddsRulesHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        seedCommitmentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        selectedAssetReference:
          description: |
            The asset this rip claimed from the sealed snapshot. Null once the rip
            has FAILED: a failed acquisition never delivered the asset, so it is
            released back to the eligible pool for the next rip against the same
            snapshot rather than being permanently unavailable.
          type: [string, 'null']
        failedAssetReference:
          description: |
            Audit trail of the asset a FAILED rip had selected before it was
            released back to the eligible pool. Null for every other status.
          type: [string, 'null']
        acquisitionReference:
          type: [string, 'null']
        settlementReference:
          type: [string, 'null']
        insuredValueMinor:
          type: string
          pattern: '^[0-9]+$'
        insuredValueCurrency:
          type: string
          const: USDC
        insuredValueDecimals:
          type: integer
          const: 6
        idempotencyKey:
          type: [string, 'null']
          minLength: 1
          maxLength: 240
        selectedAt:
          type: string
          format: date-time
        revealedAt:
          type: [string, 'null']
          format: date-time
        acquiredAt:
          type: [string, 'null']
          format: date-time
        settledAt:
          type: [string, 'null']
          format: date-time
        failedAt:
          type: [string, 'null']
          format: date-time
        failureReason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GachaRipOddsCommitment:
      type: object
      additionalProperties: false
      required:
        - calculatorVersion
        - committedAt
        - oddsKey
        - rulesHash
        - schemaVersion
        - snapshotContentHash
        - version
      properties:
        calculatorVersion:
          type: string
        committedAt:
          type: string
          format: date-time
        oddsKey:
          type: string
        rulesHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        schemaVersion:
          type: string
        snapshotContentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        version:
          type: integer
          minimum: 1
    GachaRipResult:
      type: object
      additionalProperties: false
      required: [oddsCommitment, rip, serverSeed, serverSeedHash]
      properties:
        oddsCommitment:
          $ref: '#/components/schemas/GachaRipOddsCommitment'
        rip:
          $ref: '#/components/schemas/GachaRip'
        serverSeed:
          description: |
            The secret serverSeed committed before the roll, revealed only once
            the rip has reached a terminal (SETTLED or FAILED) state. Hashing
            this value with SHA-256 must equal serverSeedHash, letting a player
            independently verify the roll was not steered after the fact.
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        serverSeedHash:
          description: |
            The same hash originally published by POST
            /gacha/machines/{machineKey}/rip-commitments, echoed back once the
            rip is terminal.
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
    FantasyProductCapabilities:
      type: object
      additionalProperties: false
      required: [modes, network, oracle]
      properties:
        modes:
          type: object
          additionalProperties: false
          required: [tournaments, entries, payouts]
          properties:
            tournaments:
              $ref: '#/components/schemas/CapabilityAvailability'
            entries:
              $ref: '#/components/schemas/CapabilityAvailability'
            payouts:
              $ref: '#/components/schemas/CapabilityAvailability'
        network:
          type: string
          const: solana-devnet
        oracle:
          type: object
          additionalProperties: false
          required: [mode, live]
          properties:
            mode:
              type: string
            live:
              type: boolean
    SolanaAddress:
      type: string
      pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$'
      examples: [9xQeWvG816bUx9EPfEZvD6nGQ3xM4wzHY6zvQ3z9gJ1]
    PackId:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{2,63}$'
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency, decimals]
      properties:
        amount:
          type: string
          pattern: '^[0-9]+$'
          description: Integer minor units encoded as a string.
        currency:
          type: string
          enum: [USDC]
        decimals:
          type: integer
          const: 6
    ValuationPolicyDocument:
      type: object
      additionalProperties: false
      required: [hashAlgorithm, policyHash, policy]
      properties:
        hashAlgorithm:
          type: string
          const: sha256
        policyHash:
          type: string
          enum:
            - 406b8f93087ba9910d74006cef30fb7872dcabd763e99215488f06f119b8d66b
            - 39186a3c3b133d001d3c17dd3832b45c2286e3df81ba13494e3cef638a48baf8
        policy:
          $ref: '#/components/schemas/ValuationPolicy'
    ValuationPolicy:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - policyVersion
        - authoritativeField
        - comparisonMetric
        - currency
        - decimals
        - numericRepresentation
        - rounding
        - maxSourceAgeSeconds
        - maxValueMinorUnits
        - maxFutureSkewSeconds
        - tieRule
        - providerCorrectionRule
      properties:
        schemaVersion:
          type: string
          const: openpacksduel.valuation-policy.v1
        policyVersion:
          type: string
          enum: [collector-crypt-insured-value-usdc-v1, openpacksduel-pokemon-tcg-market-usdc-v1]
        authoritativeField:
          type: string
          enum: [collector-crypt.gacha.result.insuredValue, pokemon-tcg.tcgplayer.prices.<first-supported-variant>.market]
          description: The source field committed before funding. Hosted devnet demos use a persisted Pokémon TCG TCGPlayer market snapshot; the disabled Collector Crypt adapter uses insured value.
        comparisonMetric:
          type: string
          const: insured-value
        currency:
          type: string
          const: USDC
        decimals:
          type: integer
          const: 6
        numericRepresentation:
          type: string
          const: unsigned-integer-minor-units
        rounding:
          type: string
          const: none
        maxSourceAgeSeconds:
          type: integer
          enum: [300, 604800]
        maxValueMinorUnits:
          type: string
          const: '18446744073709551615'
        maxFutureSkewSeconds:
          type: integer
          enum: [0, 30]
        sourceSelection:
          type: object
          additionalProperties: false
          required: [fallbackRule, priceField, updatedAtInterpretation, usdToMicroUsdc, variantOrder]
          properties:
            fallbackRule: { type: string, const: reject-if-no-listed-variant-has-positive-market }
            priceField: { type: string, const: market }
            updatedAtInterpretation: { type: string, const: utc-start-of-day }
            usdToMicroUsdc: { type: string, const: require-two-decimal-usd-then-multiply-by-1000000 }
            variantOrder:
              type: array
              const: [holofoil, reverseHolofoil, normal, 1stEditionHolofoil]
        tieRule:
          type: string
          const: return-original-assets-and-refund-platform-fees
        providerCorrectionRule:
          type: string
          const: immutable-after-result-commit-dispute-or-refund
    Pack:
      type: object
      additionalProperties: false
      required: [id, name, provider, price, active, valuationPolicyHash]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          description: Pack inventory provider identifier.
        providerPackId:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        imageUrl:
          type: string
          format: uri
        active:
          type: boolean
        valuationPolicyHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    PackList:
      type: object
      additionalProperties: false
      required: [data, hasMore]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Pack'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    MatchmakingMode:
      type: string
      enum: [direct, house, open]
    MatchmakingSearchRequest:
      type: object
      additionalProperties: false
      required: [wallet, packId]
      properties:
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
        packId:
          $ref: '#/components/schemas/PackId'
    MatchmakingWalletRequest:
      type: object
      additionalProperties: false
      required: [wallet]
      properties:
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
    MatchmakingSession:
      type: object
      additionalProperties: false
      required:
        - duelId
        - wallet
        - role
        - state
        - houseOpponent
        - queue
        - searchExpiresAt
        - availableActions
        - cancellationRule
      properties:
        duelId:
          type: string
          pattern: '^duel_[A-Za-z0-9]{12,64}$'
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
        role:
          type: string
          enum: [creator, opponent]
        state:
          type: string
          enum: [searching, matched]
        houseOpponent:
          type: boolean
        opponentWallet:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        searchExpiresAt:
          type: string
          format: date-time
        commitmentExpiresAt:
          type: [string, 'null']
          format: date-time
        cancellationRule:
          type: string
        availableActions:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [action, available]
            properties:
              action:
                type: string
                enum: [continue_search, cancel_search, house_fallback]
              available:
                type: boolean
              disclosure:
                type: string
        queue:
          type: object
          additionalProperties: false
          required: [packId, tier, valuationPolicyHash, providerMode, regionSegment, riskSegment, queueKey]
          properties:
            packId:
              $ref: '#/components/schemas/PackId'
            tier:
              type: integer
            valuationPolicyHash:
              type: string
              pattern: '^[a-f0-9]{64}$'
            providerMode:
              type: string
              enum: [mock, dailydraft-devnet, collector-crypt-sandbox]
            regionSegment:
              type: string
            riskSegment:
              type: string
            queueKey:
              type: string
              pattern: '^[a-f0-9]{64}$'
    DuelStatus:
      type: string
      enum:
        - waiting
        - matched
        - committing
        - funded
        - opening
        - awaiting_assets
        - settling
        - settled
        - cancelling
        - cancelled
        - refunding
        - refunded
        - failed
    CreateDuelRequest:
      type: object
      additionalProperties: false
      required: [creatorWallet, packId, matchmakingMode, expiresAt]
      properties:
        analyticsSessionId:
          type: string
          pattern: '^anon_[a-f0-9]{32}$'
        creatorWallet:
          $ref: '#/components/schemas/SolanaAddress'
        opponentWallet:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        packId:
          $ref: '#/components/schemas/PackId'
        matchmakingMode:
          $ref: '#/components/schemas/MatchmakingMode'
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future and no more than 24 hours from creation.
    JoinDuelRequest:
      type: object
      additionalProperties: false
      required: [wallet]
      properties:
        analyticsSessionId:
          type: string
          pattern: '^anon_[a-f0-9]{32}$'
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
    CancelDuelRequest:
      type: object
      additionalProperties: false
      required: [wallet]
      properties:
        analyticsSessionId:
          type: string
          pattern: '^anon_[a-f0-9]{32}$'
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
        reason:
          type: string
          maxLength: 160
    Duel:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - matchmakingMode
        - creatorWallet
        - environment
        - providerMode
        - houseOpponent
        - pack
        - stake
        - version
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/DuelStatus'
        matchmakingMode:
          $ref: '#/components/schemas/MatchmakingMode'
        creatorWallet:
          $ref: '#/components/schemas/SolanaAddress'
        environment:
          type: string
          const: solana-devnet
        providerMode:
          type: string
          enum: [mock, dailydraft-devnet, collector-crypt-sandbox]
          description: Mock outcomes are valueless and never represent transferred assets.
        houseOpponent:
          type: boolean
        opponentWallet:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        pack:
          $ref: '#/components/schemas/Pack'
        stake:
          $ref: '#/components/schemas/Money'
        escrowAddress:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        transactionSignature:
          type: [string, 'null']
        winnerWallet:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        result:
          oneOf:
            - $ref: '#/components/schemas/DuelResult'
            - type: 'null'
        opponentJoinedAt:
          type: [string, 'null']
          format: date-time
        cancellationReason:
          type: [string, 'null']
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DuelPackOutcome:
      type: object
      additionalProperties: false
      required: [side, assetReference, displayName, insuredValue, openedAt, poolVersion, sourceTimestamp, resultHash, isMock, provider, providerReference]
      properties:
        side:
          type: string
          enum: [creator, opponent]
        assetReference:
          type: string
          description: Public asset identity; provider request references remain server-only.
        displayName:
          type: string
          maxLength: 160
        imageUrl:
          type: [string, 'null']
          format: uri
        insuredValue:
          $ref: '#/components/schemas/Money'
          description: Backward-compatible result field. Its authoritative meaning comes from valuationPolicyHash; hosted demo outcomes contain the snapshotted TCGPlayer market value, not Collector Crypt insured value.
        openedAt:
          type: string
          format: date-time
          description: Provider-reported completion time committed as escrow opened_at; its whole-second value must be between finalized funding and expiry and no more than 30 seconds ahead of server time.
        poolVersion:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          description: Immutable provider inventory/value-pool snapshot shared by both outcomes.
        sourceTimestamp:
          type: string
          format: date-time
          description: Timestamp when the API captured the authoritative provider value snapshot before comparison.
        valuationSourceReference:
          type: [string, 'null']
          description: Exact provider card, selected price variant, value field, and upstream update timestamp bound into the outcome hash when available.
        resultHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        isMock:
          type: boolean
        provider:
          type: string
        providerReference:
          type: string
          description: Public pack-opening reference recorded for independent provider support.
    DuelResult:
      type: object
      additionalProperties: false
      required:
        - comparisonMetric
        - outcomes
        - resultHash
        - settlementReady
        - tieRule
        - valuationPolicyHash
        - winnerSide
      properties:
        comparisonMetric:
          type: string
          const: insured-value
        outcomes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/DuelPackOutcome'
        resultHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        settlementReady:
          type: boolean
          description: Results can be passed to settlement; assets are not yet transferred.
        tieRule:
          type: string
          const: return-original-assets-and-refund-platform-fees
          description: Equal canonical comparison values return each original card and refund both platform fees.
        valuationPolicyHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        winnerSide:
          type: [string, 'null']
          enum: [creator, opponent, null]
    PublicDuelStatus:
      oneOf:
        - $ref: '#/components/schemas/DuelStatus'
        - type: string
          const: expired
    PublicParticipant:
      type: object
      additionalProperties: false
      required: [address, display, role]
      properties:
        address:
          $ref: '#/components/schemas/SolanaAddress'
        display:
          type: string
        role:
          type: string
          enum: [creator, opponent, house]
    PublicDuelReceipt:
      type: object
      additionalProperties: false
      required: [schemaVersion, duel, pack, participants, result, fees, custody, references, recovery, availability, cardActions, actions, privacy]
      properties:
        schemaVersion:
          type: string
          const: dailydraft.receipt.v1
        duel:
          type: object
          additionalProperties: false
          required: [id, status, mode, network, createdAt, expiresAt, observedAt]
          properties:
            id: { type: string }
            status: { $ref: '#/components/schemas/PublicDuelStatus' }
            mode: { $ref: '#/components/schemas/MatchmakingMode' }
            network: { type: string, const: solana-devnet }
            createdAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            observedAt: { type: string, format: date-time }
        pack:
          type: object
          additionalProperties: false
          required: [id, name, provider, providerMode, providerPackId, tier]
          properties:
            id: { type: string }
            name: { type: string }
            provider: { type: string }
            providerMode:
              type: string
              enum: [mock, dailydraft-devnet, collector-crypt-sandbox]
            providerPackId: { type: [string, 'null'] }
            tier: { $ref: '#/components/schemas/Money' }
        participants:
          type: object
          additionalProperties: false
          required: [creator, opponent]
          properties:
            creator: { $ref: '#/components/schemas/PublicParticipant' }
            opponent:
              oneOf:
                - $ref: '#/components/schemas/PublicParticipant'
                - type: 'null'
        result:
          oneOf:
            - $ref: '#/components/schemas/PublicDuelResult'
            - type: 'null'
        fees:
          type: object
          additionalProperties: false
          required: [asset, perSideAmountLamports, finalizedSides, requiredSides, totalFinalizedAmountLamports]
          properties:
            asset: { type: string, const: WSOL }
            perSideAmountLamports: { type: [string, 'null'], pattern: '^\d+$' }
            finalizedSides: { type: integer, minimum: 0, maximum: 2 }
            requiredSides: { type: integer, const: 2 }
            totalFinalizedAmountLamports: { type: [string, 'null'], pattern: '^\d+$' }
        custody:
          type: object
          additionalProperties: false
          required: [platformFee, cardAssets]
          properties:
            platformFee:
              type: object
              additionalProperties: false
              required: [asset, escrowAddress, status]
              properties:
                asset: { type: string, const: WSOL }
                escrowAddress:
                  oneOf:
                    - $ref: '#/components/schemas/SolanaAddress'
                    - type: 'null'
                status: { type: string, enum: [not-started, partially-funded, funded] }
            cardAssets:
              type: object
              additionalProperties: false
              required: [status, detail]
              properties:
                status: { type: string, enum: [not-recorded, provider-results-recorded, settlement-reference-recorded] }
                detail: { type: string }
        references:
          type: object
          additionalProperties: false
          required: [provider, solana]
          properties:
            provider:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [side, provider, providerReference, assetReference]
                properties:
                  side: { type: string, enum: [creator, opponent] }
                  provider: { type: string }
                  providerReference: { type: string }
                  assetReference: { type: string }
            solana:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [action, bindingSource, signature, status, finalizedAt, recoveredAt, explorerUrl]
                properties:
                  action:
                    type: string
                    enum: [fund, cancel, refund, open_pack, commit_result, settle]
                  bindingSource: { type: string, enum: [api-submission, rpc-recovery] }
                  signature: { type: string }
                  status: { type: string, enum: [prepared, submitted, confirmed, finalized, failed, expired] }
                  finalizedAt: { type: [string, 'null'], format: date-time }
                  recoveredAt: { type: [string, 'null'], format: date-time }
                  explorerUrl: { type: string, format: uri }
        recovery:
          type: object
          additionalProperties: false
          required: [status, alerts]
          properties:
            status: { type: string, enum: [none, recovered, attention-required] }
            alerts:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [action, code, detectedAt, signature, explorerUrl]
                properties:
                  action: { type: string, enum: [fund, commit_result, settle] }
                  code: { type: string, const: UNBOUND_FINALIZED_ESCROW_STATE_MISMATCH }
                  detectedAt: { type: string, format: date-time }
                  signature: { type: string }
                  explorerUrl: { type: string, format: uri }
        availability:
          type: object
          additionalProperties: false
          required: [complete, missing]
          properties:
            complete: { type: boolean }
            missing: { type: array, items: { type: string } }
        cardActions:
          $ref: '#/components/schemas/PublicPostDuelCardActions'
        actions:
          $ref: '#/components/schemas/PublicActions'
        privacy:
          $ref: '#/components/schemas/PublicPrivacy'
    PublicDuelResult:
      type: object
      additionalProperties: false
      required: [comparisonMetric, outcomes, policy, proof, resultHash, settlementReady, valuationPolicyHash, winnerSide, winner, margin, totalValue]
      properties:
        comparisonMetric: { type: string, const: insured-value }
        outcomes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [side, assetReference, displayName, insuredValue, isMock, openedAt, poolVersion, sourceTimestamp, valuationSourceReference, resultHash]
            properties:
              side: { type: string, enum: [creator, opponent] }
              assetReference: { type: string }
              displayName: { type: string }
              imageUrl: { type: [string, 'null'], format: uri }
              insuredValue: { $ref: '#/components/schemas/Money' }
              isMock: { type: boolean }
              openedAt: { type: string, format: date-time }
              poolVersion: { type: string }
              sourceTimestamp: { type: string, format: date-time }
              valuationSourceReference: { type: [string, 'null'] }
              resultHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        policy:
          type: object
          additionalProperties: false
          required: [authoritativeField, currency, decimals, hash, hashAlgorithm, maxSourceAgeSeconds, maxValueMinorUnits, policyVersion, rounding, tieRule]
          properties:
            authoritativeField: { type: string, enum: [collector-crypt.gacha.result.insuredValue, pokemon-tcg.tcgplayer.prices.<first-supported-variant>.market] }
            currency: { type: string, const: USDC }
            decimals: { type: integer, const: 6 }
            hash: { type: string, pattern: '^[a-f0-9]{64}$' }
            hashAlgorithm: { type: string, const: sha256 }
            maxSourceAgeSeconds: { type: integer, enum: [300, 604800] }
            maxValueMinorUnits: { type: string, const: '18446744073709551615' }
            policyVersion: { type: string, enum: [collector-crypt-insured-value-usdc-v1, openpacksduel-pokemon-tcg-market-usdc-v1] }
            rounding: { type: string, const: none }
            tieRule: { type: string, const: return-original-assets-and-refund-platform-fees }
        proof:
          type: object
          additionalProperties: false
          required: [schemaVersion, context, creatorResultHash, opponentResultHash, poolVersion, providerAttestation]
          properties:
            schemaVersion: { type: string, const: dailydraft.result-proof.v1 }
            context:
              type: object
              additionalProperties: false
              required: [duelId, creatorWallet, opponentWallet, escrowAddress, network, providerMode]
              properties:
                duelId: { type: string }
                creatorWallet: { $ref: '#/components/schemas/SolanaAddress' }
                opponentWallet: { $ref: '#/components/schemas/SolanaAddress' }
                escrowAddress: { $ref: '#/components/schemas/SolanaAddress' }
                network: { type: string, const: solana-devnet }
                providerMode:
                  type: string
                  enum: [mock, dailydraft-devnet, collector-crypt-sandbox]
            creatorResultHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            opponentResultHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            poolVersion: { type: string }
            providerAttestation:
              type: object
              additionalProperties: false
              required: [required, scope, status]
              properties:
                required: { type: boolean }
                scope: { type: string, enum: [none, escrow-mints-values-policy] }
                status: { type: string, enum: [mock-not-applicable, not-recorded, on-chain-commitment-finalized] }
        resultHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        settlementReady: { type: boolean }
        valuationPolicyHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        winnerSide: { type: [string, 'null'], enum: [creator, opponent, null] }
        winner:
          oneOf:
            - $ref: '#/components/schemas/PublicParticipant'
            - type: 'null'
        margin: { $ref: '#/components/schemas/Money' }
        totalValue: { $ref: '#/components/schemas/Money' }
    PublicPostDuelCardActions:
      type: object
      additionalProperties: false
      required: [schemaVersion, availability, reason, receiptHref, cards]
      properties:
        schemaVersion:
          type: string
          const: dailydraft.card-actions.v1
        availability:
          type: string
          enum: [available, hidden]
        reason:
          type: [string, 'null']
          enum: [duel-not-settled, mock-assets, ownership-mismatch, ownership-pending, null]
        receiptHref:
          type: string
          description: Stable API path linking every card state to its originating duel receipt.
        cards:
          type: array
          maxItems: 2
          description: Empty unless exact finalized settlement reconciles canonical ownership.
          items:
            $ref: '#/components/schemas/PublicPostDuelCardActionState'
    PublicPostDuelCardActionState:
      type: object
      additionalProperties: false
      required: [actionStateId, duelId, side, assetReference, providerReference, displayName, insuredValue, owner, ownership, receiptHref, actions]
      properties:
        actionStateId:
          type: string
          description: Stable projection identifier; repeated reads do not create an action or transaction.
        duelId: { type: string }
        side: { type: string, enum: [creator, opponent] }
        assetReference: { type: string }
        providerReference: { type: string }
        displayName: { type: string }
        imageUrl: { type: [string, 'null'], format: uri }
        insuredValue: { $ref: '#/components/schemas/Money' }
        owner: { $ref: '#/components/schemas/PublicParticipant' }
        ownership:
          type: object
          additionalProperties: false
          required: [status, basis, settlementSignature]
          properties:
            status: { type: string, const: reconciled }
            basis: { type: string, const: finalized-settlement-reference }
            settlementSignature: { type: string }
        receiptHref: { type: string }
        actions:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/PublicPostDuelCardAction'
    PublicPostDuelCardAction:
      type: object
      additionalProperties: false
      required: [action, label, capability, availability, reason, detail, requiresSignature, transaction, alternative]
      properties:
        action: { type: string, enum: [keep, list, sell-back, redeem] }
        label: { type: string }
        capability:
          type: string
          enum: [ownership-receipt, collector-crypt-marketplace-listing, collector-crypt-buyback, collector-crypt-shipping]
        availability: { type: string, enum: [available, unavailable] }
        reason:
          type: [string, 'null']
          enum: [partner-onboarding-required, null]
        detail: { type: string }
        requiresSignature:
          type: boolean
          const: false
          description: No unavailable partner action returns an unsigned or fake transaction.
        transaction:
          type: 'null'
        alternative:
          oneOf:
            - type: object
              additionalProperties: false
              required: [action, label]
              properties:
                action: { type: string, const: keep }
                label: { type: string, const: Keep card }
            - type: 'null'
    PublicActions:
      type: object
      additionalProperties: false
      required: [primary, rematch, share]
      properties:
        primary: { $ref: '#/components/schemas/PublicAction' }
        rematch:
          oneOf:
            - $ref: '#/components/schemas/PublicAction'
            - type: 'null'
        share: { $ref: '#/components/schemas/PublicAction' }
    PublicAction:
      type: object
      additionalProperties: false
      required: [href, label]
      properties:
        href: { type: string }
        label: { type: string }
    PublicPrivacy:
      type: object
      additionalProperties: false
      required: [indexable, reason]
      properties:
        indexable: { type: boolean, const: false }
        reason: { type: string }
    PublicDuelLeaderboard:
      type: object
      additionalProperties: false
      required: [schemaVersion, entries, methodology, privacy]
      properties:
        schemaVersion: { type: string, const: dailydraft.leaderboard.v1 }
        entries:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [rank, display, profileHref, record, totalWonValue, lastPlayedAt]
            properties:
              rank: { type: integer, minimum: 1, maximum: 50 }
              display: { type: string }
              profileHref: { type: string }
              record:
                type: object
                additionalProperties: false
                required: [completed, wins, losses, ties]
                properties:
                  completed: { type: integer, minimum: 0 }
                  wins: { type: integer, minimum: 0 }
                  losses: { type: integer, minimum: 0 }
                  ties: { type: integer, minimum: 0 }
              totalWonValue: { $ref: '#/components/schemas/Money' }
              lastPlayedAt: { type: string, format: date-time }
        methodology:
          type: object
          additionalProperties: false
          required: [entryLimit, sampleLimit, sampledSettledDuels, hasMoreSettledDuels, excludesMockResults, ranking]
          properties:
            entryLimit: { type: integer, const: 50 }
            sampleLimit: { type: integer, const: 5000 }
            sampledSettledDuels: { type: integer, minimum: 0, maximum: 5000 }
            hasMoreSettledDuels: { type: boolean }
            excludesMockResults: { type: boolean, const: true }
            ranking:
              type: string
              const: wins-total-value-completed-recency
        privacy: { $ref: '#/components/schemas/PublicPrivacy' }
    PublicWalletProfile:
      type: object
      additionalProperties: false
      required: [schemaVersion, wallet, record, biggestWin, duels, pagination, privacy]
      properties:
        schemaVersion: { type: string, const: dailydraft.profile.v1 }
        wallet:
          type: object
          additionalProperties: false
          required: [address, display]
          properties:
            address: { $ref: '#/components/schemas/SolanaAddress' }
            display: { type: string }
        record:
          type: object
          additionalProperties: false
          required: [total, active, completed, wins, losses, refunded, cancelledOrExpired]
          properties:
            total: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            wins: { type: integer, minimum: 0 }
            losses: { type: integer, minimum: 0 }
            refunded: { type: integer, minimum: 0 }
            cancelledOrExpired: { type: integer, minimum: 0 }
        biggestWin:
          oneOf:
            - type: object
              additionalProperties: false
              required: [duelId, prizeValue]
              properties:
                duelId: { type: string }
                prizeValue: { $ref: '#/components/schemas/Money' }
            - type: 'null'
        duels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [duelId, status, result, packName, tier, opponentDisplay, createdAt, receiptHref, rematchHref]
            properties:
              duelId: { type: string }
              status: { $ref: '#/components/schemas/PublicDuelStatus' }
              result: { type: string, enum: [win, loss, none] }
              packName: { type: string }
              tier: { $ref: '#/components/schemas/Money' }
              opponentDisplay: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
              receiptHref: { type: string }
              rematchHref: { type: [string, 'null'] }
        pagination:
          type: object
          additionalProperties: false
          required: [hasMore, sampleLimit]
          properties:
            hasMore: { type: boolean }
            sampleLimit: { type: integer, minimum: 1, maximum: 100 }
        privacy: { $ref: '#/components/schemas/PublicPrivacy' }
    DuelList:
      type: object
      additionalProperties: false
      required: [data, hasMore]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Duel'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    DuelEvent:
      type: object
      additionalProperties: false
      required: [id, duelId, sequence, type, createdAt]
      properties:
        id:
          type: string
        duelId:
          type: string
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
        actorWallet:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/DuelStatus'
            - type: 'null'
        toStatus:
          oneOf:
            - $ref: '#/components/schemas/DuelStatus'
            - type: 'null'
        data:
          type: [object, 'null']
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    PrepareTransactionRequest:
      type: object
      additionalProperties: false
      required: [action, wallet]
      properties:
        action:
          type: string
          const: fund
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
    PrepareProviderEscrowRequest:
      type: object
      additionalProperties: false
      required: [operation, callerWallet]
      properties:
        operation:
          type: string
          enum: [deposit_card, commit_result, settle, refund_card, refund_payment]
        callerWallet: { $ref: '#/components/schemas/SolanaAddress' }
        side: { type: string, enum: [creator, opponent] }
        sourceTokenAccount: { $ref: '#/components/schemas/SolanaAddress' }
        assetStandard: { type: string, const: legacy-spl-nft }
        providerRequestId: { type: string, pattern: '^[a-f0-9]{64}$' }
    PreparedProviderEscrowTransaction:
      type: object
      additionalProperties: false
      required:
        - action
        - chain
        - duelId
        - expectedSigner
        - instruction
        - intentId
        - lastValidBlockHeight
        - messageSha256
        - programId
        - proof
        - recentBlockhash
        - reconciliation
        - serializedTransactionBase64
        - status
        - warnings
      properties:
        action:
          type: string
          enum: [deposit_card, commit_result, settle, refund_card, refund_payment]
        chain: { type: string, const: 'solana:devnet' }
        duelId: { type: string }
        expectedSigner: { $ref: '#/components/schemas/SolanaAddress' }
        instruction: { type: object, additionalProperties: true }
        intentId:
          type: [string, 'null']
          description: Durable monitor intent ID; null only for card deposits pending operator proof.
        lastValidBlockHeight: { type: string, pattern: '^\d+$' }
        messageSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        programId: { $ref: '#/components/schemas/SolanaAddress' }
        proof: { type: object, additionalProperties: { type: [string, 'null'] } }
        recentBlockhash: { type: string }
        reconciliation:
          type: string
          enum: [operator-proof, submission-monitor]
        serializedTransactionBase64: { type: string, contentEncoding: base64 }
        status: { type: string, const: prepared }
        warnings:
          type: array
          items: { type: string }
    PreparedTransaction:
      type: object
      additionalProperties: false
      required:
        - id
        - duelId
        - action
        - status
        - cluster
        - chain
        - wallet
        - fundingSide
        - feeAmountLamports
        - feeAmountSol
        - feeRecipient
        - escrowAddress
        - paymentMint
        - programId
        - recentBlockhash
        - lastValidBlockHeight
        - expiresAt
        - serializedTransactionBase64
        - warnings
      properties:
        id: { type: string }
        duelId: { type: string }
        action:
          type: string
          const: fund
        status:
          type: string
          const: prepared
        cluster: { type: string, const: devnet }
        chain: { type: string, const: 'solana:devnet' }
        wallet: { $ref: '#/components/schemas/SolanaAddress' }
        fundingSide: { type: string, enum: [creator, opponent] }
        feeAmountLamports: { type: string, pattern: '^\d+$' }
        feeAmountSol: { type: string }
        feeRecipient: { $ref: '#/components/schemas/SolanaAddress' }
        escrowAddress: { $ref: '#/components/schemas/SolanaAddress' }
        paymentMint: { $ref: '#/components/schemas/SolanaAddress' }
        programId: { $ref: '#/components/schemas/SolanaAddress' }
        recentBlockhash: { type: string }
        lastValidBlockHeight: { type: string, pattern: '^\d+$' }
        expiresAt: { type: string, format: date-time }
        serializedTransactionBase64:
          type: string
          contentEncoding: base64
        warnings:
          type: array
          items: { type: string }
          minItems: 1
    DuelTransactionRecord:
      type: object
      additionalProperties: false
      required: [id, duelId, action, status, network, wallet, createdAt, updatedAt]
      properties:
        id:
          type: string
        duelId:
          type: string
        action:
          type: string
          enum: [fund, cancel, refund, open_pack, commit_result, settle]
        status:
          type: string
          enum: [prepared, submitted, confirmed, finalized, failed, expired]
        network:
          type: string
          const: solana-devnet
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
        signature:
          type: [string, 'null']
        recentBlockhash:
          type: [string, 'null']
        recoveredAt:
          type: [string, 'null']
          format: date-time
          description: Set only after bounded escrow-PDA recovery verifies a persisted prepared intent.
        recoveryAlertCode:
          type: [string, 'null']
          enum: [UNBOUND_FINALIZED_ESCROW_STATE_MISMATCH, null]
        recoveryCandidateAt:
          type: [string, 'null']
          format: date-time
        recoveryCandidateSignature:
          type: [string, 'null']
        lastValidBlockHeight:
          type: [string, 'null']
        providerReference:
          type: [string, 'null']
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        submittedAt:
          type: [string, 'null']
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
        finalizedAt:
          type: [string, 'null']
          format: date-time
        confirmationStatus:
          type: [string, 'null']
          enum: [confirmed, finalized, null]
        checkAttempts:
          type: integer
          minimum: 0
        lastCheckedAt:
          type: [string, 'null']
          format: date-time
        stuckAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecordSubmissionRequest:
      type: object
      additionalProperties: false
      required: [signature]
      properties:
        signature:
          type: string
          pattern: '^[1-9A-HJ-NP-Za-km-z]{64,96}$'
    BoundSubmission:
      type: object
      additionalProperties: false
      required: [transactionId, duelId, signature, status]
      properties:
        transactionId:
          type: string
          pattern: '^tx_[A-Za-z0-9]{12,64}$'
        duelId:
          type: string
          pattern: '^duel_[A-Za-z0-9]{12,64}$'
        signature:
          type: string
        status:
          type: string
          const: submitted
    RejectedFundingIntent:
      type: object
      additionalProperties: false
      required: [transactionId, duelId, status, reason]
      properties:
        transactionId:
          type: string
          pattern: '^tx_[A-Za-z0-9]{12,64}$'
        duelId:
          type: string
          pattern: '^duel_[A-Za-z0-9]{12,64}$'
        status:
          type: string
          const: expired
        reason:
          type: string
          const: wallet_rejected_before_broadcast
    ReconciliationSummary:
      type: object
      additionalProperties: false
      required: [checked, confirmed, expired, failed, finalized, pending, recoveryAlerts, recoveryCandidates, recoveryChecked, recoveryDeferred, recoveryErrors, recoveryRejected, recovered, stuck]
      properties:
        checked:
          type: integer
          minimum: 0
        confirmed:
          type: integer
          minimum: 0
        expired:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        finalized:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        recoveryCandidates:
          type: integer
          minimum: 0
        recoveryChecked:
          type: integer
          minimum: 0
        recoveryAlerts:
          type: integer
          minimum: 0
        recoveryDeferred:
          type: integer
          minimum: 0
        recoveryErrors:
          type: integer
          minimum: 0
        recoveryRejected:
          type: integer
          minimum: 0
        recovered:
          type: integer
          minimum: 0
        stuck:
          type: integer
          minimum: 0
    DuelReconciliationResult:
      type: object
      additionalProperties: false
      required: [activeTransactionCount, duelId, duelStatus, reconciliation]
      properties:
        activeTransactionCount:
          type: integer
          minimum: 0
        duelId:
          type: string
          pattern: '^duel_[A-Za-z0-9]{12,64}$'
        duelStatus:
          $ref: '#/components/schemas/DuelStatus'
        reconciliation:
          $ref: '#/components/schemas/ReconciliationSummary'
    SocialCard:
      type: object
      additionalProperties: false
      required: [duelId, status, pageUrl, imageUrl]
      properties:
        duelId:
          type: string
        status:
          $ref: '#/components/schemas/DuelStatus'
        pageUrl:
          type: string
          format: uri
        imageUrl:
          type: string
          format: uri
        shareText:
          type: string
          maxLength: 280
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        requestId:
          type: string
