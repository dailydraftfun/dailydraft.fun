          pattern: '^crashround_[A-Za-z0-9._:-]{8,128}$'
        safeNextAction:
          $ref: '#/components/schemas/CrashSafeNextAction'
        schemaVersion:
          type: string
          const: dailydraft.crash-receipt.v1
        settlement:
          type: object
          additionalProperties: false
          required:
            - expectedOperationCount
            - finalizedOperationCount
            - receiptHash
            - recoveryReason
            - status
          properties:
            expectedOperationCount:
              type: integer
              minimum: 0
            finalizedOperationCount:
              type: integer
              minimum: 0
            receiptHash:
              type: [string, 'null']
              pattern: '^[a-f0-9]{64}$'
            recoveryReason:
              type: [string, 'null']
              maxLength: 480
            status:
              $ref: '#/components/schemas/CrashSettlementStatus'
        stage:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/CrashStatus'
        terminalAt:
          type: [string, 'null']
          format: date-time
        terminalReason:
          type: [string, 'null']
          maxLength: 480
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    CrashReceiptEvent:
      type: object
      additionalProperties: false
      required:
