            - custodyPolicyVersion
            - inventoryPolicyHash
            - inventoryPolicyVersion
            - riskRulesHash
            - riskRulesVersion
            - rulesHash
            - rulesVersion
            - settlementPolicyHash
            - settlementPolicyVersion
            - stateMachineRulesHash
            - stateMachineVersion
          properties:
            architectureVersion:
              type: string
            calculatorVersion:
              type: string
            custodyPolicyHash:
              type: [string, 'null']
              pattern: '^[a-f0-9]{64}$'
            custodyPolicyVersion:
              type: [string, 'null']
            inventoryPolicyHash:
              type: [string, 'null']
              pattern: '^[a-f0-9]{64}$'
            inventoryPolicyVersion:
              type: [string, 'null']
            riskRulesHash:
              type: string
              pattern: '^[a-f0-9]{64}$'
            riskRulesVersion:
              type: string
            rulesHash:
              type: string
              pattern: '^[a-f0-9]{64}$'
            rulesVersion:
              type: string
            settlementPolicyHash:
              type: [string, 'null']
              pattern: '^[a-f0-9]{64}$'
            settlementPolicyVersion:
              type: [string, 'null']
            stateMachineRulesHash:
              type: string
              pattern: '^[a-f0-9]{64}$'
            stateMachineVersion:
              type: string
        createdAt:
          type: string
          format: date-time
        decisionDeadline:
          type: [string, 'null']
          format: date-time
        custody:
          type: object
          additionalProperties: false
          required: [preparedIntentCount, recoveryRequiredIntentCount, status]
          properties:
            preparedIntentCount:
              type: integer
              minimum: 0
            recoveryRequiredIntentCount:
              type: integer
              minimum: 0
            status:
              type: string
              enum: [not-started, prepared, recovery-required]
        events:
          type: array
          maxItems: 500
          description: |
            Ordered by occurredAt ascending. At equal timestamps, transition
            events come first by numeric sequence, custody events next by event
            ID, and settlement events last by numeric sequence.
          items:
            $ref: '#/components/schemas/CrashReceiptEvent'
        finality:
          type: object
          additionalProperties: false
          required: [custody, gameState, settlement]
          properties:
            custody:
              type: string
              enum: [not-final, recovery-required, settled]
            gameState:
              type: string
              const: committed
            settlement:
              $ref: '#/components/schemas/CrashSettlementStatus'
