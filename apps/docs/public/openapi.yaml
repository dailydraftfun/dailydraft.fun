            maxLength: 160
        - name: assetReference
          in: query
          schema:
            type: string
            maxLength: 160
      responses:
        '200':
          description: Attention queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/duels/{duelId}/timeline:
