openapi: 3.1.0
info:
  title: OpenPacks Duel API
  version: 0.2.0-devnet
  summary: Build pack-opening duels on Solana
  description: |
    Preview contract for pack discovery, duel matchmaking, wallet-signed Solana
    transactions, status tracking, and social sharing. The API never accepts
    wallet private keys and does not replace on-chain verification. Every duel
    created by this contract is explicitly Solana devnet-only. Mock provider
    responses never imply funding, settlement, or mainnet readiness.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: OpenPacks Duel
    url: https://github.com/openpacksduel
servers:
  - url: http://localhost:3003/v1
    description: Local development
  - url: https://api.openpacksduel.com/v1
    description: Reserved devnet API endpoint (not live; not mainnet)
tags:
  - name: Packs
    description: Duel-eligible pack definitions and current inventory metadata.
  - name: Duels
    description: Public matchmaking intents and canonical duel state.
  - name: Transactions
    description: Unsigned Solana transactions for wallet inspection and approval.
  - name: Social
    description: Canonical share pages and generated social-card images.
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API process health
      x-openpacksduel-availability: devnet
      responses:
        '200':
          description: API process is accepting requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /packs:
    get:
      operationId: listPacks
      tags: [Packs]
      summary: List duel-eligible pack definitions
      x-openpacksduel-availability: devnet
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: active
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Pack definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /packs/{packId}:
    get:
      operationId: getPack
      tags: [Packs]
      summary: Get one pack definition
      x-openpacksduel-availability: devnet
      parameters:
        - $ref: '#/components/parameters/PackId'
      responses:
        '200':
          description: Pack definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pack'
        '404':
          $ref: '#/components/responses/NotFound'
  /duels:
    get:
      operationId: listDuels
      tags: [Duels]
      summary: List public duels
      x-openpacksduel-availability: devnet
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DuelStatus'
        - name: wallet
          in: query
          schema:
            $ref: '#/components/schemas/SolanaAddress'
        - name: matchmakingMode
          in: query
          schema:
            $ref: '#/components/schemas/MatchmakingMode'
        - name: packId
          in: query
          schema:
            $ref: '#/components/schemas/PackId'
      responses:
        '200':
          description: Duels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuelList'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createDuel
      tags: [Duels]
      summary: Create an off-chain duel intent
      description: The returned intent is not funded until its Solana transaction confirms.
      x-openpacksduel-availability: devnet
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDuelRequest'
      responses:
        '201':
          description: Duel intent created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /duels/{duelId}:
    get:
      operationId: getDuel
      tags: [Duels]
      summary: Get canonical duel state
      x-openpacksduel-availability: devnet
      parameters:
        - $ref: '#/components/parameters/DuelId'
      responses:
        '200':
          description: Duel state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duel'
        '404':
          $ref: '#/components/responses/NotFound'
  /duels/{duelId}/join:
    post:
      operationId: joinDuel
      tags: [Duels]
      summary: Join a direct invitation or open devnet duel
      description: |
        Atomically claims an open duel or accepts a direct invitation. House
        duels are already matched at creation and cannot be joined.
      x-openpacksduel-availability: devnet
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DuelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinDuelRequest'
      responses:
        '200':
          description: Duel matched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /duels/{duelId}/cancel:
    post:
      operationId: cancelDuel
      tags: [Duels]
      summary: Cancel an unfunded devnet duel
      description: |
        A participant can cancel only while the duel is waiting or matched.
        Expired waiting and matched duels deterministically become cancelled
        with the `timeout` reason.
      x-openpacksduel-availability: devnet
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DuelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelDuelRequest'
      responses:
        '200':
          description: Duel cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /duels/{duelId}/events:
    get:
      operationId: listDuelEvents
      tags: [Duels]
      summary: List the authenticated immutable duel state timeline
      description: Internal event data is never exposed by an unauthenticated endpoint.
      x-openpacksduel-availability: devnet
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DuelId'
      responses:
        '200':
          description: Ordered audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DuelEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /duels/{duelId}/transactions:
    get:
      operationId: listDuelTransactions
      tags: [Transactions]
      summary: List authenticated reconciliation-safe Solana transaction records
      description: Raw provider errors and transaction metadata require an integration key.
      x-openpacksduel-availability: devnet
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DuelId'
      responses:
        '200':
          description: Ordered transaction records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DuelTransactionRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: prepareDuelTransaction
      tags: [Transactions]
      summary: Prepare a wallet-signed Solana transaction
      description: Returns an unsigned serialized transaction. The API never signs for a wallet.
      x-openpacksduel-availability: contract-only
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DuelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareTransactionRequest'
      responses:
        '200':
          description: Transaction ready for wallet inspection and signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/Unavailable'
  /duels/{duelId}/social-card:
    get:
      operationId: getDuelSocialCard
      tags: [Social]
      summary: Get canonical share and social-card URLs
      x-openpacksduel-availability: devnet
      parameters:
        - $ref: '#/components/parameters/DuelId'
      responses:
        '200':
          description: Canonical social URLs for the current duel status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialCard'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opd_live_...
      description: Server-side integration key. Never expose it in browser code.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PackId:
      name: packId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PackId'
    DuelId:
      name: duelId
      in: path
      required: true
      schema:
        type: string
        pattern: '^duel_[A-Za-z0-9]{12,64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid integration key
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Request conflicts with current duel state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotImplemented:
      description: Operation is contractually reserved but not available yet
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Required server configuration or dependency is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [service, status, version, dependencies]
      properties:
        service:
          type: string
          const: openpacksduel-api
        status:
          type: string
          const: ok
        version:
          type: string
          const: 0.2.0-devnet
        dependencies:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              const: ok
    SolanaAddress:
      type: string
      pattern: '^[1-9A-HJ-NP-Za-km-z]{32,44}$'
      examples: [9xQeWvG816bUx9EPfEZvD6nGQ3xM4wzHY6zvQ3z9gJ1]
    PackId:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{2,63}$'
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency, decimals]
      properties:
        amount:
          type: string
          pattern: '^[0-9]+$'
          description: Integer minor units encoded as a string.
        currency:
          type: string
          enum: [USDC]
        decimals:
          type: integer
          const: 6
    Pack:
      type: object
      additionalProperties: false
      required: [id, name, provider, price, active]
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          description: Pack inventory provider identifier.
        providerPackId:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        imageUrl:
          type: string
          format: uri
        active:
          type: boolean
        valuationPolicyHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    PackList:
      type: object
      additionalProperties: false
      required: [data, hasMore]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Pack'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    MatchmakingMode:
      type: string
      enum: [direct, house, open]
    DuelStatus:
      type: string
      enum:
        - waiting
        - matched
        - committing
        - funded
        - opening
        - awaiting_assets
        - settling
        - settled
        - cancelling
        - cancelled
        - refunding
        - refunded
        - failed
    CreateDuelRequest:
      type: object
      additionalProperties: false
      required: [creatorWallet, packId, matchmakingMode, expiresAt]
      properties:
        creatorWallet:
          $ref: '#/components/schemas/SolanaAddress'
        opponentWallet:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        packId:
          $ref: '#/components/schemas/PackId'
        matchmakingMode:
          $ref: '#/components/schemas/MatchmakingMode'
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future and no more than 24 hours from creation.
    JoinDuelRequest:
      type: object
      additionalProperties: false
      required: [wallet]
      properties:
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
    CancelDuelRequest:
      type: object
      additionalProperties: false
      required: [wallet]
      properties:
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
        reason:
          type: string
          maxLength: 160
    Duel:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - matchmakingMode
        - creatorWallet
        - environment
        - providerMode
        - houseOpponent
        - pack
        - stake
        - version
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/DuelStatus'
        matchmakingMode:
          $ref: '#/components/schemas/MatchmakingMode'
        creatorWallet:
          $ref: '#/components/schemas/SolanaAddress'
        environment:
          type: string
          const: solana-devnet
        providerMode:
          type: string
          enum: [mock, collector-crypt-sandbox]
          description: Mock mode never represents a funded or settled game.
        houseOpponent:
          type: boolean
        opponentWallet:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        pack:
          $ref: '#/components/schemas/Pack'
        stake:
          $ref: '#/components/schemas/Money'
        escrowAddress:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        transactionSignature:
          type: [string, 'null']
        winnerWallet:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        opponentJoinedAt:
          type: [string, 'null']
          format: date-time
        cancellationReason:
          type: [string, 'null']
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DuelList:
      type: object
      additionalProperties: false
      required: [data, hasMore]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Duel'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    DuelEvent:
      type: object
      additionalProperties: false
      required: [id, duelId, sequence, type, createdAt]
      properties:
        id:
          type: string
        duelId:
          type: string
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
        actorWallet:
          oneOf:
            - $ref: '#/components/schemas/SolanaAddress'
            - type: 'null'
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/DuelStatus'
            - type: 'null'
        toStatus:
          oneOf:
            - $ref: '#/components/schemas/DuelStatus'
            - type: 'null'
        data:
          type: [object, 'null']
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    TransactionAction:
      type: string
      enum: [fund, cancel, refund]
    PrepareTransactionRequest:
      type: object
      additionalProperties: false
      required: [action, wallet]
      properties:
        action:
          $ref: '#/components/schemas/TransactionAction'
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
    PreparedTransaction:
      type: object
      additionalProperties: false
      required: [transaction, encoding, expiresAt, action, summary]
      properties:
        transaction:
          type: string
          contentEncoding: base64
        encoding:
          type: string
          const: base64
        expiresAt:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/TransactionAction'
        summary:
          type: string
          description: Human-readable instructions for wallet confirmation UI.
    DuelTransactionRecord:
      type: object
      additionalProperties: false
      required: [id, duelId, action, status, network, wallet, createdAt, updatedAt]
      properties:
        id:
          type: string
        duelId:
          type: string
        action:
          type: string
          enum: [fund, cancel, refund, open_pack, settle]
        status:
          type: string
          enum: [prepared, submitted, confirmed, failed, expired]
        network:
          type: string
          const: solana-devnet
        wallet:
          $ref: '#/components/schemas/SolanaAddress'
        signature:
          type: [string, 'null']
        recentBlockhash:
          type: [string, 'null']
        lastValidBlockHeight:
          type: [string, 'null']
        providerReference:
          type: [string, 'null']
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        submittedAt:
          type: [string, 'null']
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SocialCard:
      type: object
      additionalProperties: false
      required: [duelId, status, pageUrl, imageUrl]
      properties:
        duelId:
          type: string
        status:
          $ref: '#/components/schemas/DuelStatus'
        pageUrl:
          type: string
          format: uri
        imageUrl:
          type: string
          format: uri
        shareText:
          type: string
          maxLength: 280
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        requestId:
          type: string
